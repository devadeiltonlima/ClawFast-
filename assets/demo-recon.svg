<text x="500.0" y="23" text-anchor="middle" font-size="12.5" fill="#6f9a6f">clawfast — recon de example.com</text>
<text class="cmd" x="30" y="72"><tspan class="marca">❯ </tspan>faça um recon completo de example.com</text><g class="cobre"><rect x="46.1" y="59" width="309.9" height="19" fill="#0b0f0b"/><rect class="caret" x="46.1" y="61" width="8" height="15"/></g><text class="ln l1" x="30" y="106"><tspan class="tool">[*] </tspan><tspan class="corpo">run_terminal_cmd   recon/recon_deep.py --target example.com</tspan></text><text class="ln l2" x="30" y="132"><tspan class="dim">    </tspan><tspan class="corpo">scope.txt  OK   example.com   *.example.com</tspan></text><text class="ln l3" x="30" y="156"><tspan class="tool">[*] </tspan><tspan class="corpo">recon_subdomains   crt.sh + 7 fontes</tspan></text><text class="ln l3" x="62" y="180"><tspan class="dim">encontrados  </tspan></text><text class="conta n0" x="180" y="180">0</text><text class="conta n1" x="180" y="180">9</text><text class="conta n2" x="180" y="180">23</text><text class="conta n3" x="180" y="180">38</text><text class="conta n4 fim" x="180" y="180">47</text><text class="ln l4" x="30" y="206"><tspan class="dim">    </tspan><tspan class="corpo">takeover  0   wildcard  sim</tspan></text><text class="ln l5" x="30" y="230"><tspan class="tool">[*] </tspan><tspan class="corpo">recon_ports        top-1000</tspan></text><text class="ln l6" x="30" y="256"><tspan class="dim">    </tspan><tspan class="corpo">abertas  80/tcp   443/tcp   8443/tcp</tspan></text><text class="ln l7" x="30" y="280"><tspan class="tool">[*] </tspan><tspan class="corpo">http_request       GET /api/v1/users/1337</tspan></text><text class="ln l8" x="30" y="306"><tspan class="dim">    </tspan><tspan class="corpo">200 OK   1.2 KB   application/json</tspan></text><text class="ln l9" x="30" y="330"><tspan class="alerta">[!] </tspan><tspan class="corpo">correlação  param id → Source: db.query()  ·  Discovery: /api/v1/users/:id</tspan></text><text class="ln l10" x="30" y="356"><tspan class="achado">[+] </tspan><tspan class="corpo">FINDING   IDOR   HIGH   confirmado com prova</tspan></text><text class="ln l11" x="30" y="380"><tspan class="tool">[*] </tspan><tspan class="corpo">relatório          reports/example.com.md</tspan></text><text class="ln l11" x="30" y="414"><tspan class="marca">❯ </tspan></text><rect class="caret" x="47" y="401" width="8" height="15"/><text class="rotulo" x="30" y="450">PROGRESSO DA VARREDURA</text><rect class="barra-f" x="30" y="460" width="940" height="8" rx="4"/><rect class="barra" x="30" y="460" width="940" height="8" rx="4"/></svg>
