<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 504" width="1000" height="504" font-family="'Cascadia Code','JetBrains Mono','Consolas','DejaVu Sans Mono',monospace" role="img" aria-label="clawfast: sessão de recon ao vivo">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#9dff5a"/><stop offset="1" stop-color="#16c60c"/>
</linearGradient>
<linearGradient id="varre" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#9dff5a" stop-opacity="0"/>
<stop offset="0.5" stop-color="#9dff5a" stop-opacity="0.07"/>
<stop offset="1" stop-color="#9dff5a" stop-opacity="0"/>
</linearGradient>
