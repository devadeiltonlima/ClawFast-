</radialGradient>
<filter id="brilho" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="2.2" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<style>

.ln{font-size:13.5px;white-space:pre;fill:#6f9a6f;opacity:0}
.tool{fill:#16c60c}
.dim{fill:#4e6b4e}
.alerta{fill:#ffbd2e}
.achado{fill:#9dff5a}
.marca{fill:#9dff5a}
.corpo{fill:#b9d6b9}
.cmd{font-size:13.5px;white-space:pre;fill:#dcefdc}
.rotulo{font-size:11.5px;fill:#4e6b4e;letter-spacing:1.5px}
.conta{font-size:13.5px;font-weight:700;fill:#9dff5a;opacity:0}
.caret{fill:#9dff5a}
.barra-f{fill:#132713}
.barra{fill:#16c60c;transform-origin:30px 0}
@keyframes surge{0%{opacity:0}0.6%{opacity:1}100%{opacity:1}}
@keyframes digita{0%{transform:translateX(0)}1.82%{transform:translateX(0);animation-timing-function:steps(37,end)}12.27%{transform:translateX(309.9px)}100%{transform:translateX(309.9px)}}
@keyframes bate{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
@keyframes enche{0%{transform:scaleX(0)}9%{transform:scaleX(0.18)}30%{transform:scaleX(0.52)}48%{transform:scaleX(0.71)}66%{transform:scaleX(0.93)}72%,100%{transform:scaleX(1)}}
.ln{animation:surge 22.0s linear infinite}
.cobre{animation:digita 22.0s linear infinite}
.caret{animation:bate 1s step-end infinite}
.barra{animation:enche 22.0s linear infinite}
.l1{animation-delay:2.60s}
.l2{animation-delay:3.20s}
.l3{animation-delay:4.20s}
.l4{animation-delay:6.40s}
.l5{animation-delay:7.20s}
.l6{animation-delay:8.40s}
.l7{animation-delay:9.40s}
.l8{animation-delay:10.40s}
.l9{animation-delay:11.60s}
.l10{animation-delay:13.20s}
.l11{animation-delay:14.60s}
@keyframes n0{0%{opacity:0}22.2727%{opacity:1}24.0909%{opacity:0}}
.n0{animation:n0 22.0s step-end infinite}
@keyframes n1{0%{opacity:0}24.0909%{opacity:1}25.9091%{opacity:0}}
.n1{animation:n1 22.0s step-end infinite}
@keyframes n2{0%{opacity:0}25.9091%{opacity:1}27.2727%{opacity:0}}
.n2{animation:n2 22.0s step-end infinite}
@keyframes n3{0%{opacity:0}27.2727%{opacity:1}28.6364%{opacity:0}}
.n3{animation:n3 22.0s step-end infinite}
@keyframes n4{0%{opacity:0}28.6364%{opacity:1}}
.n4{animation:n4 22.0s step-end infinite}
